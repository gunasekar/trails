name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse as POSIX sh
        run: sh -n bin/trails
      - name: ShellCheck
        run: shellcheck --severity=warning bin/trails test/*.sh test/bin/*
      - name: Smoke test
        run: |
          ./bin/trails help | grep -q '^usage: trails'
          ./bin/trails ls
          TRAILS_RECENT_MAX=0 ./bin/trails ls
      - name: Install tmux
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux
      - name: Integration tests
        run: test/run.sh
